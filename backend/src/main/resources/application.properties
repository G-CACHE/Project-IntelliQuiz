spring.application.name=IntelliQuizAPI
spring.application.version=1.0.0

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/intelliquiz}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:mysecretpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP tuning (important for SSE + concurrent API traffic)
spring.datasource.hikari.pool-name=IntelliQuizHikari
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1200000}
spring.datasource.hikari.keepalive-time=${DB_POOL_KEEPALIVE_MS:120000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:45000}
spring.datasource.hikari.auto-commit=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=false
spring.jpa.open-in-view=false

# Hibernate validates schema against entities (seed data preserved)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

server.port=${SERVER_PORT:8082}

# SSL Configuration (disabled - HTTPS handled by frontend/reverse proxy)
server.ssl.enabled=${SSL_ENABLED:false}
# server.ssl.key-store=classpath:keystore/intelliquiz.p12
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=intelliquiz

# JWT Configuration
jwt.secret=${JWT_SECRET:intelliquiz-dev-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256}
jwt.expiration=1800000

# CORS Configuration
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*,http://127.0.0.1:*,https://127.0.0.1:*,http://192.168.*:*,https://192.168.*:*,http://10.*:*,https://10.*:*,http://172.16.*:*,https://172.16.*:*,https://*.ngrok-free.dev,https://*.ngrok.io}

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# Backup Configuration
backup.directory=${BACKUP_DIR:./backups}
backup.postgres-host=${DB_HOST:localhost}
backup.postgres-port=${DB_PORT:5434}
backup.postgres-database=${DB_NAME:intelliquiz}
backup.postgres-username=${DB_USERNAME:postgres}
backup.postgres-password=${DB_PASSWORD:mysecretpassword}
backup.docker-container-name=${BACKUP_DOCKER_CONTAINER:intelliquiz_db}
backup.use-docker-exec=${BACKUP_USE_DOCKER:true}